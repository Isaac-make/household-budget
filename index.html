<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="build" content="2026-11-28m">
<title>Household Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: left sidebar on desktop (top bar + pill tabs on phones), white rounded cards on a pale blue-grey page, one blue accent. Tap-a-box tiles open a sheet with the details. */
:root {
  color-scheme: light;
  --bg: #f3f5fb;
  --surface: #ffffff;
  --surface-2: #f4f6fc;
  --line: #e7eaf3;
  --fg: #0f1733;
  --muted: #6b7391;
  --blue: #4256f4;
  --blue-2: #6070ff;
  --blue-soft: #eef0ff;
  --green: #0f9a58;
  --green-dim: #e2f6eb;
  --red: #e0434a;
  --red-dim: #fdeced;
  --amber: #b97400;
  --amber-dim: #fff3d6;
  --shadow: 0 1px 2px rgba(16,24,64,.04), 0 6px 20px rgba(16,24,64,.05);
  --font-display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
img { max-width: 100%; }
a { color: var(--blue); }

/* ----- shell ----- */
.shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: #fafbfe; border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.12rem; letter-spacing: -.01em; padding: 0 8px; }
.brand .logo { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--blue-2), var(--blue)); color: #fff; display: grid; place-items: center; font-weight: 800; box-shadow: 0 6px 14px rgba(66,86,244,.3); flex: none; }
nav.tabs { display: flex; flex-direction: column; gap: 4px; }
nav.tabs a, .gear { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: #3b4261; text-decoration: none; font-weight: 500; font-size: .95rem; }
nav.tabs svg, .gear svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: #7a82a0; }
nav.tabs a:hover, .gear:hover { background: #eef0f8; color: var(--fg); }
nav.tabs a[aria-current="page"], .gear[aria-current="page"] { background: #fff; color: var(--fg); font-weight: 700; box-shadow: var(--shadow); }
nav.tabs a[aria-current="page"] svg, .gear[aria-current="page"] svg { color: var(--blue); }
.side-foot { margin-top: auto; }
.main-col { min-width: 0; }
header.top { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-wrap: wrap; padding: 18px 28px 0; }
main { padding: 14px 28px 60px; max-width: 1280px; }
@media (max-width: 900px) {
  .shell { display: block; min-height: 0; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px; border-right: none; border-bottom: 1px solid var(--line); }
  .side-foot { margin: 0 0 0 auto; }
  .gear { padding: 8px; }
  .gear span { display: none; }
  nav.tabs { order: 3; width: 100%; flex-direction: row; overflow-x: auto; scrollbar-width: none; gap: 6px; margin: 0 -16px; padding: 0 16px; width: calc(100% + 32px); }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a { white-space: nowrap; padding: 8px 14px; border-radius: 999px; background: #eef0f8; font-size: .9rem; }
  nav.tabs svg { display: none; }
  nav.tabs a[aria-current="page"] { background: var(--blue); color: #fff; box-shadow: none; }
  header.top { padding: 12px 16px 0; justify-content: space-between; }
  main { padding: 12px 16px 60px; }
}

/* ----- type ----- */
h2 { font-weight: 800; font-size: 1.65rem; letter-spacing: -.025em; margin: 0; text-wrap: balance; line-height: 1.2; }
h3 { font-weight: 700; font-size: 1.02rem; margin: 0 0 14px; letter-spacing: -.01em; }
h4 { font-weight: 700; font-size: .95rem; margin: 0 0 10px; }
.sub { color: var(--muted); font-size: .92rem; margin: 4px 0 0; }
.view-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 28px 0 12px; }
.section-head h3 { margin: 0; font-size: 1.15rem; }
.hint { font-size: .84rem; color: var(--muted); }
.pos { color: var(--green); } .neg { color: var(--red); } .warn-t { color: var(--amber); }

/* ----- grids & cards ----- */
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) { .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) { .g2 { grid-template-columns: minmax(0, 1fr); } .span2 { grid-column: auto; } }
@media (max-width: 420px) { .grid.g4 { gap: 10px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.kpi { position: relative; overflow: hidden; }
.kpi-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.kpi .label { font-weight: 600; font-size: .95rem; color: var(--fg); }
.kpi .value { font-weight: 800; font-size: 2rem; letter-spacing: -.03em; line-height: 1.1; margin-top: 10px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .note { font-size: .85rem; color: var(--muted); margin-top: 6px; }
@media (max-width: 420px) { .card { padding: 16px; } .kpi .value { font-size: 1.55rem; } .kpi .label { font-size: .85rem; } }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; flex: none; }
.badge.up { background: var(--green-dim); color: var(--green); }
.badge.down { background: var(--red-dim); color: var(--red); }
.badge.flat { background: #eef0f7; color: var(--muted); }
.badge.blue { background: var(--blue-soft); color: var(--blue); }
.sparkw { position: relative; margin: 14px -20px -20px; height: 54px; }
.sparkw svg { display: block; width: 100%; height: 100%; }
.sparkw i { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); border: 2px solid #fff; transform: translate(-50%, -50%); box-shadow: 0 0 0 1px rgba(66,86,244,.25); }
@media (max-width: 420px) { .sparkw { margin: 10px -16px -16px; height: 40px; } }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: 24px 26px; color: #fff; background: radial-gradient(120% 140% at 100% 0%, #7584ff 0%, rgba(117,132,255,0) 55%), linear-gradient(135deg, #4a5cf6, #3443dc); box-shadow: 0 14px 30px rgba(66,86,244,.28); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: end; }
.hero .label { font-weight: 600; opacity: .85; }
.hero .big { font-size: 2.9rem; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; margin-top: 6px; font-variant-numeric: tabular-nums; }
.hero .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.hero .chip { background: rgba(255,255,255,.16); border-radius: 999px; padding: 5px 12px; font-size: .84rem; font-weight: 600; color: #fff; text-decoration: none; }
.hero a.chip:hover { background: rgba(255,255,255,.26); }
.hero .sparkw { margin: 0; height: 110px; }
.hero .sparkw i { background: #fff; border-color: #4a5cf6; box-shadow: 0 0 0 4px rgba(255,255,255,.25); }
@media (max-width: 720px) { .hero { grid-template-columns: minmax(0, 1fr); padding: 20px; } .hero .big { font-size: 2.3rem; } .hero .sparkw { height: 70px; } }

/* tap-a-box tiles */
.tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.tile { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 16px 14px; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: transform .12s, box-shadow .12s, border-color .12s; }
.tile:hover { border-color: #cfd5f7; background: #fff; transform: translateY(-1px); box-shadow: 0 2px 4px rgba(16,24,64,.05), 0 12px 28px rgba(16,24,64,.08); }
.tile-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.tile-name { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.tile-name .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.tile-val { font-weight: 800; font-size: 1.5rem; letter-spacing: -.025em; font-variant-numeric: tabular-nums; margin-top: 8px; line-height: 1.2; }
.tile-note { font-size: .83rem; color: var(--muted); }
.tile .meter { margin: 10px 0 0; height: 6px; }
.tile.add { border: 1.5px dashed #c6cce6; background: transparent; box-shadow: none; align-items: center; justify-content: center; gap: 8px; color: var(--blue); font-weight: 700; min-height: 116px; }
.tile.add:hover { background: var(--blue-soft); border-color: var(--blue); }
.tile.add .plus { width: 36px; height: 36px; border-radius: 50%; background: var(--blue-soft); display: grid; place-items: center; font-size: 1.35rem; line-height: 1; }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .tile { padding: 13px 12px 12px; border-radius: 16px; } .tile-val { font-size: 1.22rem; } .tile-name { font-size: .9rem; } .tile .badge { padding: 2px 7px; font-size: .7rem; } }

/* sheets (pop-up boxes) */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(15,23,51,.38); display: flex; align-items: center; justify-content: center; padding: 20px; }
.sheet { background: #fff; border-radius: 24px; width: min(580px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; padding: 22px; box-shadow: 0 30px 80px rgba(15,23,51,.28); overscroll-behavior: contain; }
.sheet.anim { animation: pop .16s ease-out; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.sheet-head h3 { margin: 0; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
.sheet .close { border: none; background: #eef0f7; width: 38px; height: 38px; border-radius: 50%; font-size: 1.3rem; line-height: 1; padding: 0; flex: none; color: var(--fg); box-shadow: none; }
.sheet-big { font-size: 2.4rem; font-weight: 800; letter-spacing: -.035em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.sheet-sec { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; }
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
@media (max-width: 640px) {
  .sheet-bg { align-items: flex-end; padding: 0; }
  .sheet { border-radius: 24px 24px 0 0; max-height: 92vh; padding: 18px 16px calc(22px + env(safe-area-inset-bottom, 0px)); }
  .sheet.anim { animation: up .2s ease-out; }
  .sheet-big { font-size: 2rem; }
}
@keyframes pop { from { transform: scale(.97); opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
body.sheet-open { overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { border-radius: 999px; padding: 6px 12px; font-size: .84rem; background: var(--blue-soft); color: var(--blue); border: none; box-shadow: none; }
.chip-btn:hover { background: #e0e4ff; }
.preset { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; }
.preset b { display: block; }
.preset small { color: var(--muted); font-weight: 500; }

/* ----- controls ----- */
button, .btn { font: inherit; font-weight: 600; font-size: .9rem; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--fg); padding: 9px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button:hover, .btn:hover { border-color: #c9cfe6; background: #fafbff; }
button:disabled { opacity: .6; cursor: default; }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 4px 12px rgba(66,86,244,.25); }
button.primary:hover { background: #3647e6; border-color: #3647e6; }
button.danger { color: var(--red); }
button.ghost { background: transparent; border-color: transparent; }
button.small { padding: 6px 12px; font-size: .82rem; border-radius: 10px; }
button.block { width: 100%; padding: 12px 16px; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
input, select { font: inherit; color: var(--fg); background: #fff; border: 1px solid #dde1ee; border-radius: 12px; padding: 10px 12px; min-width: 0; width: 100%; font-variant-numeric: tabular-nums; }
input:hover, select:hover { border-color: #c3c9de; }
input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(66,86,244,.14); outline: none; }
input:disabled, select:disabled { background: var(--surface-2); color: var(--muted); }
label.f { display: grid; gap: 6px; font-size: .82rem; color: var(--muted); font-weight: 600; min-width: 0; }
.money { position: relative; display: block; }
.money::before { content: "£"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.money input { padding-left: 26px; }
.money.lg::before { font-size: 1.25rem; left: 14px; font-weight: 600; }
.money.lg input { font-size: 1.35rem; font-weight: 700; padding: 11px 14px 11px 32px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1 1 140px; }
.row > button { flex: 0 0 auto; }
.stack { display: grid; gap: 12px; }
.check { display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--fg); }
.check input { width: 18px; height: 18px; accent-color: var(--blue); flex: none; }
.ro { opacity: .75; cursor: not-allowed; }
.month-nav { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 4px; box-shadow: var(--shadow); }
.month-nav .m { font-weight: 800; font-size: 1.1rem; min-width: 150px; text-align: center; letter-spacing: -.01em; }
.month-nav button { border: none; box-shadow: none; padding: 8px 12px; }
.seg { display: inline-flex; background: #e9ecf6; border-radius: 12px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.seg button { border: none; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 9px; box-shadow: none; font-weight: 600; }
.seg button:hover { background: rgba(255,255,255,.6); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--fg); box-shadow: 0 1px 3px rgba(16,24,64,.12); }
.status { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status .dot { width: 8px; height: 8px; }
.status .dot { background: var(--muted); }
.status.ok .dot { background: #19b46b; }
.status.warn .dot { background: #f0a020; }
.x { background: none; border: none; color: var(--muted); padding: 2px 8px; font-size: 1.05rem; cursor: pointer; box-shadow: none; }
.x:hover { color: var(--red); background: var(--red-dim); }
.x.confirm, button.confirm { color: var(--red); font-size: .75rem; font-weight: 700; }

/* ----- tables, pills, meters ----- */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; }
th { text-align: left; font-size: .75rem; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line); }
td { padding: 9px 8px; border-bottom: 1px solid #f0f2f8; white-space: nowrap; }
td.wrap-t { white-space: normal; }
td.r, th.r { text-align: right; }
tr.muted td { color: #a2a8bf; }
.scroll-y { max-height: 320px; overflow-y: auto; }
.pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.pill.g { background: var(--green-dim); color: var(--green); }
.pill.r { background: var(--red-dim); color: var(--red); }
.pill.a { background: var(--amber-dim); color: var(--amber); }
.pill.b { background: var(--blue-soft); color: var(--blue); }
.pill.n { background: #eef0f7; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.meter { height: 8px; border-radius: 999px; background: #edf0f7; overflow: hidden; margin: 8px 0 4px; }
.meter i { display: block; height: 100%; background: var(--blue); border-radius: 999px; }
.meter.warn i { background: #f0a020; }
.meter.over i { background: var(--red); }
.chart-box { position: relative; height: 260px; }
.chart-box.tall { height: 320px; }
.chart-box.short { height: 220px; }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--amber-dim); border: 1px solid #f6dc9c; border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; font-size: .9rem; }
.banner b { color: var(--amber); }
.legend-list { display: grid; gap: 6px; margin-top: 10px; font-size: .85rem; }
.disclaimer { font-size: .8rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; margin-top: 12px; }
.ring { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.ring svg { flex: none; }
.empty { color: var(--muted); font-size: .9rem; padding: 20px 0; text-align: center; }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input[type=range] { padding: 0; accent-color: var(--blue); border: none; background: transparent; box-shadow: none; }
.range-row output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 64px; text-align: right; color: var(--fg); }
.pot-facts { display: grid; gap: 2px; margin-top: 10px; font-size: .88rem; }
.pot-facts b { font-variant-numeric: tabular-nums; }
details.more { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: .88rem; font-weight: 600; }
details.more summary:hover { color: var(--fg); }
details.more[open] summary { margin-bottom: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: #fff; padding: 10px 18px; border-radius: 12px; font-size: .9rem; font-weight: 600; z-index: 60; box-shadow: 0 10px 30px rgba(15,23,51,.25); max-width: calc(100% - 32px); }
.gate { max-width: 520px; margin: 40px auto; }
.who-note { background: var(--blue-soft); color: #33408f; border-radius: 14px; padding: 10px 14px; margin-bottom: 16px; font-size: .88rem; }
.ro-mode main form, .ro-mode main details.more, .ro-mode main .x, .ro-mode main [data-act], .ro-mode main [data-live], .ro-mode main [data-repeat], .ro-mode main .tile.add, .ro-mode main .hint.live-hint { display: none !important; }
label.btn { cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.tile-val, .tile-note, .tile .meter { display: block; }
.kpi-btn { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; padding: 20px; border-radius: 20px; }
.kpi-btn > span { display: block; }
.flow { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); align-items: stretch; gap: 4px; padding: 8px; }
.flow-cell { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; text-align: left; gap: 2px; border: none; box-shadow: none; background: transparent; border-radius: 14px; padding: 14px; font: inherit; color: inherit; min-width: 0; }
button.flow-cell { cursor: pointer; }
button.flow-cell:hover { background: var(--surface-2); }
.flow-cell .label { font-weight: 600; font-size: .9rem; }
.flow-cell .value { font-weight: 800; font-size: 1.75rem; letter-spacing: -.03em; line-height: 1.15; margin-top: 6px; font-variant-numeric: tabular-nums; }
.flow-cell .note { font-size: .8rem; color: var(--blue); overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.flow-cell.result { background: var(--surface-2); }
.flow-cell.result .note { color: var(--muted); }
.flow-op { align-self: center; font-size: 1.4rem; font-weight: 700; color: #b5bbd0; padding: 0 2px; }
@media (max-width: 900px) { .flow { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } .flow-op { display: none; } .flow-cell { background: var(--surface-2); } .flow-cell .value { font-size: 1.4rem; } }

/* ---------- state & storage ---------- */
// GitHub locations. The site lives in SITE_REPO (public); the encrypted data lives in DATA_REPO (private).
const OWNER = "Isaac-make", SITE_REPO = "household-budget", DATA_REPO = "Monetary-policy";

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* ---------- calculations ---------- */
const monthData = k => state.months[k] || { income: { base: 0, op: 0, other: 0 }, saved: 0, spend: {} };

// Savings-type places: anything except current accounts and credit cards, plus Trading 212 cash
// A joint account lives on one person's list; the other person sees it as "@owner:id"
function potOf(id) {
  if (typeof id === "string" && id.startsWith("@")) { const i = id.indexOf(":"), pid = id.slice(1, i), pot = id.slice(i + 1); return P[pid] ? (P[pid].pots || []).find(x => x.id === pot) || null : null; }

}
function sharedPots() {

  HH.people.forEach(pp => { if (pp.id !== ui.who && P[pp.id]) (P[pp.id].pots || []).forEach(p => { if (p.joint) out.push({ ...p, id: "@" + pp.id + ":" + p.id, owner: pp.name }); }); });

const myAndShared = () => state.pots.concat(sharedPots());
function endType(e) { if (e === "t212") return "t212"; const p = potOf(e); return p ? p.type : ""; }
function isSaveEnd(e) { const t = endType(e); return !!t && t !== "current" && t !== "credit"; }

function movesSaved(k) {

  const all = Math.max(num(f[p.id]), cardPaidIn(p, k), cardOwedIn(p, k));

        <label class="f" style="flex:1 1 150px">${label}<span class="money lg"><input id="ia-${key}" inputmode="decimal" value="${num(m.income[key]) || ""}" placeholder="0.00" autocomplete="off"></span></label>
        <label class="f" style="flex:1 1 170px">Went into<select id="it-${key}">${accountOptions(toFor(key), true, "Not into an account")}</select></label>
      </div>`;
    return sheetWrap("Money in", "Money in", `
      <div class="sheet-big">${gbp(incomeOf(m))}</div><div class="hint">money in for ${ml}</div>
      <form id="incomeForm" class="stack" style="margin-top:16px">
        ${line("base", "Pay (take-home)")}
        ${line("op", "Op pay")}
        <p class="hint" style="margin:0">Pick the account it lands in and that balance goes up. Pay that goes straight into savings, an ISA or Trading 212 counts as saved.</p>
        <button class="primary block" type="submit" id="btnIncome">Save</button>
      </form>
      <div class="row sheet-sec" style="align-items:center"><span class="hint" style="flex:1 1 160px">Extra money: <b>${gbp(num(m.income.other))}</b></span><button type="button" class="small" data-sheet="inc:extra" id="btnToExtra">+ Add extra money</button></div>`, ml);
  }

  if (type === "cat") {
    const c = state.categories.find(c => c.id === id); if (!c) return "";
    const ci = state.categories.indexOf(c);
    const v = catSpend(c, k), b = num(c.budget), p = b ? v / b * 100 : 0;
    const status = b ? (p > 100 ? `<span class="neg">${gbp(v - b)} over your ${gbp0(b)} limit</span>` : `${gbp(b - v)} left of your ${gbp0(b)} limit`) : `spent in ${ml}`;
    const head = `<span class="dot" style="background:${catColor(c, ci)}"></span>${esc(c.name)}`;
    const top = `<div class="sheet-big">${gbp(v)}</div><div class="hint">${status}</div>${b ? `<div class="meter ${p > 100 ? "over" : p >= 80 ? "warn" : ""}"><i style="width:${Math.min(100, p)}%"></i></div>` : ""}`;
    const settings = `<div class="sheet-sec"><div class="row">
        <label class="f">Monthly limit<span class="money"><input id="bg-${c.id}" data-budget="${c.id}" inputmode="decimal" value="${b || ""}" placeholder="No limit"></span></label>
      </div>
      ${c.linked ? "" : `<label class="check" style="margin-top:12px"><input type="checkbox" data-fixed="${c.id}" id="fx-${c.id}"${c.fixed ? " checked" : ""}> It's a bill (the same each month, copied by "Copy bills")</label>`}
      <div class="row" style="margin-top:14px;justify-content:space-between"><button type="button" class="small danger" data-delcat="${c.id}" id="del-${c.id}">Remove this category</button></div></div>`;
    if (c.linked) return sheetWrap(head, c.name, `${top}<p class="hint">This fills in by itself from the Presents tab, in the month each present was bought.</p><a class="btn" href="#gifts">Go to Presents</a>${settings}`, ml);
    const list = (m.payments || []).map((x, j) => ({ x, j })).filter(o => o.x.cat === c.id).sort((a, b) => b.x.date.localeCompare(a.x.date) || b.j - a.j).map(o => o.x);
    const mode = lsGet("hb-catmode") === "add" ? "add" : "total";
    return sheetWrap(head, c.name, `${top}
      <div class="seg" role="group" aria-label="How to change it" style="margin-top:16px"><button type="button" data-catmode="total" id="cm-total" aria-pressed="${mode === "total"}">Change the total</button><button type="button" data-catmode="add" id="cm-add" aria-pressed="${mode === "add"}">Add a payment</button></div>
      ${mode === "total" ? `<form id="totalForm" class="stack" style="margin-top:12px">
        <input type="hidden" id="totCat" value="${c.id}">
        <label class="f">Total spent on ${esc(c.name)} in ${ml}<span class="money lg"><input id="totAmt" inputmode="decimal" value="${v ? v.toFixed(2) : ""}" placeholder="0.00" autocomplete="off"></span></label>
        <button class="primary block" type="submit" id="btnTotal">Save total</button>
        <p class="hint" style="margin:0">Just type what you've spent so far this month. No need to list what it was.</p>
      </form>` : `<form id="payForm" class="stack" style="margin-top:12px">
        <input type="hidden" id="payCat" value="${c.id}">
        <label class="f">Paid with<select id="payFrom">${payWithOptions(defaultPayWith())}</select></label>
        <div class="row">
          <label class="f" style="flex:1 1 150px">Amount<span class="money lg"><input id="payAmt" inputmode="decimal" placeholder="0.00" autocomplete="off"></span></label>
          <label class="f" style="flex:2 1 180px">What for (optional)<input id="payNote" maxlength="40" placeholder="e.g. Tesco, Shell" autocomplete="off"></label>
        </div>
        <button class="primary block" type="submit" id="btnPay">Add payment</button>
      </form>`}
      <div class="sheet-sec"${list.length || mode === "add" ? "" : " hidden"}><h4>Payments in ${ml}</h4>${list.length ? `<div class="tbl-wrap scroll-y" style="max-height:240px"><table><tbody>${list.map(x => `<tr><td>${shortDate(x.date)}</td><td class="wrap-t">${esc(x.note || "")}${x.from ? `<br><span class="hint">${esc(endName(x.from))}</span>` : ""}</td><td class="r"><b>${gbp(num(x.amount))}</b></td><td class="r" style="width:34px"><button class="x" data-delpay="${x.id}" id="dp-${x.id}" aria-label="Delete payment">×</button></td></tr>`).join("")}</tbody></table></div>` : '<p class="hint" style="margin:0">None logged yet. Each payment you add goes on top of the total.</p>'}</div>
      ${settings}`, ml);
  }
  if (type === "pay") {
    const cats = state.categories.filter(c => !c.linked); if (!cats.length) return "";
    if (!cats.find(c => c.id === ui.payCat)) ui.payCat = cats[0].id;
    return sheetWrap("Log a payment", "Log a payment", `
      <form id="payForm" class="stack">
        <label class="f">Paid with<select id="payFrom">${payWithOptions(defaultPayWith())}</select></label>
        <label class="f">Category<select id="payCat">${cats.map(c => `<option value="${c.id}"${c.id === ui.payCat ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>
        <div class="row">
          <label class="f" style="flex:1 1 150px">Amount<span class="money lg"><input id="payAmt" inputmode="decimal" placeholder="0.00" autocomplete="off"></span></label>
          <label class="f" style="flex:2 1 180px">What for (optional)<input id="payNote" maxlength="40" placeholder="e.g. Tesco, Shell" autocomplete="off"></label>
        </div>
        <button class="primary block" type="submit" id="btnPay">Add payment</button>
      </form>
      <p class="hint">It goes on top of that category's total for ${ml}. Tap a category box to see or delete its payments.</p>`, ml);
  }
  if (type === "inc") {
    if (id === "extra") {
      const list = (m.extras || []).map((x, j) => ({ x, j })).sort((a, b) => b.x.date.localeCompare(a.x.date) || b.j - a.j).map(o => o.x);
      return sheetWrap('<span class="dot" style="background:#16b47e"></span>Extra money', "Extra money", `
        <div class="sheet-big pos">${gbp(num(m.income.other))}</div><div class="hint">extra money in ${ml}</div>
        <form id="extraForm" class="stack" style="margin-top:16px">
          <div class="chips">${EXTRA_IDEAS.map((t, j) => `<button type="button" class="chip-btn" data-exnote="${esc(t)}" id="exi-${j}">${esc(t)}</button>`).join("")}</div>
          <div class="row">
            <label class="f" style="flex:1 1 150px">Amount<span class="money lg"><input id="exAmt" inputmode="decimal" placeholder="0.00" autocomplete="off"></span></label>
            <label class="f" style="flex:2 1 180px">What was it?<input id="exNote" maxlength="40" placeholder="e.g. Sold jacket on Vinted" autocomplete="off"></label>
          </div>
          <label class="f">Went into<select id="exTo">${accountOptions(ui.exTo !== undefined ? ui.exTo : firstCurrent(), true, "Not into an account")}</select></label>
          <button class="primary block" type="submit" id="btnExtra">Add money in</button>
        </form>
        <div class="sheet-sec"><h4>Logged in ${ml}</h4>${list.length ? `<div class="tbl-wrap scroll-y" style="max-height:240px"><table><tbody>${list.map(x => `<tr><td>${shortDate(x.date)}</td><td class="wrap-t">${esc(x.note || "")}</td><td class="r pos"><b>+${gbp(num(x.amount))}</b></td><td class="r" style="width:34px"><button class="x" data-delextra="${x.id}" id="dx-${x.id}" aria-label="Delete">×</button></td></tr>`).join("")}</tbody></table></div>` : '<p class="hint" style="margin:0">Nothing yet. Sold a jacket, got a refund, did overtime? Add it above and it counts as money in.</p>'}</div>
        <div class="sheet-sec"><label class="f">Or type the month's total<span class="money"><input id="inc-other" data-inc="other" inputmode="decimal" value="${num(m.income.other) || ""}" placeholder="0.00"></span></label></div>`, ml);
    }
    const isOp = id === "op";
    return sheetWrap(`<span class="dot" style="background:${isOp ? "#8b5cf6" : "#4256f4"}"></span>${isOp ? "Op pay" : "Base pay"}`, isOp ? "Op pay" : "Base pay", `
      <label class="f">${isOp ? "Op / deployment pay" : "Take-home pay"} for ${ml}<span class="money lg"><input id="inc-${id}" data-inc="${id}" inputmode="decimal" value="${num(m.income[id]) || ""}" placeholder="0.00" autocomplete="off"></span></label>
      <p class="hint">${isOp ? "Kept separate so the Overview can show how much of your Op money you put away." : "What actually lands in your bank after tax. \"Copy bills\" copies this from last month too."}</p>${done}`, ml);
  }
  if (type === "saved") {
    const pl = plannedFor(k), saved = savedOf(k), manual = num(m.saved);
    const mvs = (state.transfers || []).filter(t => t.date.startsWith(k) && (countsAsSaving(t.from, t.to) || takesFromSaving(t.from, t.to)));
    const ins = [...Object.entries(m.incomeIn || {}).filter(([, x]) => x && isSaveEnd(x.to)).map(([key, x]) => [key === "op" ? "Op pay" : "Pay", x.to, num(x.amt)]),
      ...(m.extras || []).filter(x => x.to && isSaveEnd(x.to)).map(x => [x.note || "Extra money", x.to, num(x.amount)])];
    return sheetWrap('<span class="dot" style="background:#f5a524"></span>Saved / invested', "Saved or invested", `
      <div class="sheet-big">${gbp(saved)}</div><div class="hint">saved or invested in ${ml}${pl ? ` · ${saved >= pl ? `<span class="pos">plan of ${gbp0(pl)} hit</span>` : `${gbp0(pl - saved)} short of your ${gbp0(pl)} plan`}` : ""}</div>
      <div class="row" style="margin-top:14px"><button type="button" class="primary" data-sheet="move" id="svMove">⇄ Move money</button></div>
      <div class="sheet-sec"><h4>How it adds up</h4>
        ${mvs.length || ins.length ? `<table><tbody>
          ${ins.map(([n, to, a]) => `<tr><td class="wrap-t">${esc(n)} → ${esc(endName(to))}</td><td class="r pos"><b>+${gbp(a)}</b></td></tr>`).join("")}
          ${mvs.map(t => { const plus = countsAsSaving(t.from, t.to); return `<tr><td class="wrap-t">${shortDate(t.date)} · ${esc(endName(t.from))} → ${esc(endName(t.to))}</td><td class="r ${plus ? "pos" : "neg"}"><b>${plus ? "+" : "−"}${gbp(num(t.amount))}</b></td></tr>`; }).join("")}
          ${manual ? `<tr><td>Typed in below</td><td class="r"><b>+${gbp(manual)}</b></td></tr>` : ""}
        </tbody></table>` : '<p class="hint" style="margin:0">Nothing yet. Use Move money, or pick a savings account under Money in, and it adds up here by itself.</p>'}
        <p class="hint">Money taken out of savings to pay a credit card (or into a current account) comes off.</p>
      </div>
      <div class="sheet-sec row">
        <label class="f">Other saving not shown above<span class="money"><input id="inc-saved" data-saved="1" inputmode="decimal" value="${manual || ""}" placeholder="0.00" autocomplete="off"></span></label>
        <label class="f">Planned to save<span class="money"><input id="inc-planned" data-planned="1" inputmode="decimal" value="${m.planned !== undefined && m.planned !== "" ? num(m.planned) : ""}" placeholder="${num(state.plan.monthly)}" autocomplete="off"></span></label>
      </div>
      ${done}`, ml);
  }
  if (type === "spent") {
    const ct = catTotal(k), set = hasSpentTotal(m), cur = spendOf(k);
    const accs = myAndShared().filter(p => p.type === "credit" || p.type === "current").sort((a, b) => (b.type === "credit") - (a.type === "credit"));
    const from = m.spentFrom || {};
    const fromSum = Object.values(from).reduce((t, v) => t + num(v), 0);
    const other = m.spentOther !== undefined ? num(m.spentOther) : set ? Math.max(0, num(m.spentTotal) - fromSum) : 0;
    const row = (id, name, color, sub, val) => `<div class="spent-row"><span class="tile-name"><i class="dot" style="background:${color}"></i><span><span class="t">${esc(name)}</span>${sub ? `<small class="hint" style="display:block;font-weight:500">${sub}</small>` : ""}</span></span><span class="money"><input id="sf-${id}" data-sf="${id}" inputmode="decimal" value="${val ? val.toFixed(2) : ""}" placeholder="0.00" autocomplete="off" aria-label="Spent from ${esc(name)}"></span></div>`;
    return sheetWrap('<span class="dot" style="background:#f2555a"></span>Spent', "Spent", `
      <div class="sheet-big" id="spentLive">${gbp(cur)}</div><div class="hint">spent in ${ml}</div>
      <form id="spentForm" class="stack" style="margin-top:14px">
        <div class="hint" style="font-weight:600">Where did it come from?</div>
        <div>${accs.map(p => row(p.id, p.name, (TYPES[p.type] || {}).color, p.type === "credit" ? "Credit card · owes " + gbp(potBalance(p)) + (num(p.cashback) ? " · " + num(p.cashback) + "% back" : "") : "Balance " + gbp(potBalance(p)), num(from[p.id]))).join("")}
        ${row("other", accs.length ? "Cash or somewhere else" : "Total spent", "#c3c9dc", "", other)}</div>
        ${accs.length ? `<label class="check"><input type="checkbox" id="spentBal" checked> Change those account balances too (adds to what the card owes, takes it off the current account)</label>` : ""}
        <button class="primary block" type="submit" id="btnSpent">Save</button>
      </form>
      <p class="hint">Type what you've spent from each one so far this month. Your categories add up to <b>${gbp(ct)}</b>${set && cur > ct ? `; the other <b>${gbp(cur - ct)}</b> shows as "Not sorted"` : ""}.</p>
      ${set ? `<button type="button" class="small ghost" data-act="spent-auto" id="btnSpentAuto">Go back to adding up my categories (${gbp(ct)})</button>` : ""}`, ml);
  }
  if (type === "newcat") {
    return sheetWrap("Add a category", "Add a category", `
      <form id="addCat" class="stack">
        <label class="f">Name<input id="newCatName" placeholder="e.g. Gym, Rent, Subscriptions" maxlength="40" autocomplete="off"></label>
        <label class="f">Monthly limit (optional)<span class="money"><input id="newCatBudget" inputmode="decimal" placeholder="No limit"></span></label>
        <label class="check"><input type="checkbox" id="newCatFixed"> It's a bill (the same each month)</label>
        <button class="primary block" type="submit" id="btnAddCat">Add category</button>
      </form>`);
  }
  if (type === "cash") {
    const cash = latestAt(state.sp.cash.history, todayISO()), rate = num(state.sp.cash.rate);
    return sheetWrap(`<span class="dot" style="background:${CASH_COL}"></span>Trading 212 cash`, "Trading 212 cash", `
      <div class="sheet-big">${gbp(cash)}</div><div class="hint">${rate ? rate + "% interest, about " + gbp(cash * rate / 100) + " a year" : "Sitting in your investing account, not invested yet"}</div>
      <form id="cashAdd" class="row" style="margin-top:16px">
        <label class="f">Paid in more cash<span class="money"><input id="cashIn" inputmode="decimal" placeholder="e.g. 200"></span></label>
        <button class="primary" type="submit" id="btnCashIn">Add</button>
      </form>
      <div class="sheet-sec"><form id="cashForm" class="row">
        <label class="f">Cash balance now<span class="money"><input id="cashBal" inputmode="decimal" value="${cash ? cash.toFixed(2) : ""}" placeholder="0.00"></span></label>
        <label class="f">Interest rate %<input id="cashRate" inputmode="decimal" value="${rate || ""}" placeholder="e.g. 4"></label>
        <button type="submit" id="btnCash">Save</button>
      </form>
      <p class="hint">Buys you mark "paid from the cash waiting" come off this automatically.</p></div>`);
  }
  if (type === "newhold") {
    const have = new Set(state.sp.holdings.map(h => (h.ticker || "").toUpperCase()));
    return sheetWrap("Add an investment", "Add an investment", `
      <div class="stack">${PRESETS.map(p => `<button type="button" class="preset" data-preset="${p.key}" id="pre-${p.key}"${have.has(p.ticker) ? " disabled" : ""}><span class="dot" style="background:${p.color}"></span><span><b>${esc(p.short)}</b><small>${esc(p.desc)}${have.has(p.ticker) ? " · already added" : ""}</small></span></button>`).join("")}</div>
      <div class="sheet-sec"><h4>Search for something else</h4>
        <input id="holdSearch" type="search" placeholder="Type a name, e.g. Tesco, FTSE 100, Nasdaq" autocomplete="off" aria-label="Search funds and shares">
        <div id="holdResults" class="stack" style="margin-top:10px"><p class="hint" style="margin:0">Funds and shares listed in London. Tap one to add it.</p></div>
      </div>`);
  }
  if (type === "hold") {
    const h = state.sp.holdings.find(h => h.id === id); if (!h) return "";
    const st = holdStats(h), g = st.value - st.paid, gp = st.paid ? g / st.paid * 100 : 0;
    const snap = latestSnap(h);
    const live = (ui.live && ui.live[h.id]) || {};
    const cash = latestAt(state.sp.cash.history, todayISO());
    const hist = h.buys.map((b, j) => ({ b, j })).sort((a, c) => c.b.date.localeCompare(a.b.date) || (c.b.at || 0) - (a.b.at || 0) || c.j - a.j).map(o => o.b);
    const counted = new Set(st.buys);
    const snapSh = snap ? sharesIn(snap) : 0;
    const last = st.buys.filter(b => !b.opening).slice(-1)[0];
    return sheetWrap(`<span class="dot" style="background:${h.color}"></span>${esc(h.short || h.name)}`, h.short || h.name, `
      <div class="sheet-big">${gbp(st.value)}</div>
      <div class="hint">${st.shares ? `${fmtShares(st.shares)} shares × ${gbp(st.price)}${liveQuote(h) ? " · Yahoo price at " + quoteTime(liveQuote(h)) : h.priceDate ? " (price from " + shortDate(h.priceDate) + ")" : ""}` : "Add what you own below."}</div>
      ${st.shares ? `<div class="pills"><span class="pill ${g >= 0 ? "g" : "r"}">${g >= 0 ? "+" : "−"}${gbp(Math.abs(g))} (${pct(gp)})</span><span class="pill n">Put in ${gbp(st.paid)}</span><span class="pill n">Average ${gbp(st.avg)} a share</span></div>` : ""}
      <div class="row" style="margin-top:12px;align-items:center"><button type="button" class="small" data-live="${h.id}" id="live-${h.id}"${live.busy ? " disabled" : ""}>${live.busy ? "Fetching…" : "Get live price"}</button><span class="hint ${live.ok ? "pos" : live.msg && !live.busy ? "warn-t" : ""}" style="flex:1 1 200px">${esc(live.msg || (h.ticker ? "Yahoo Finance: " + h.ticker : "No ticker set (see Name and ticker below)"))}</span></div>

      <div class="sheet-sec"><h4>What you own right now</h4>
        <p class="hint" style="margin:-4px 0 12px">Copy these from your trading app. Saving this replaces anything logged before today, so nothing gets counted twice.</p>
        <form class="stack" data-openform="${h.id}">
          <div class="row">
            <label class="f">Number of shares<input id="os-${h.id}" inputmode="decimal" value="${snap ? +snapSh.toFixed(6) : ""}" placeholder="e.g. 12.3456" autocomplete="off"></label>
            <label class="f">Total you've paid<span class="money"><input id="ot-${h.id}" inputmode="decimal" value="${snap ? num(snap.amount).toFixed(2) : ""}" placeholder="e.g. 1250.00" autocomplete="off"></span></label>
          </div>
          <label class="f">or your average price per share<span class="money"><input id="oa-${h.id}" inputmode="decimal" value="${snap ? +num(snap.price).toFixed(4) : ""}" placeholder="e.g. 98.40" autocomplete="off"></span></label>
          <button class="primary block" type="submit" id="ob-${h.id}">Save what I own</button>
        </form>
      </div>

      <div class="sheet-sec"><h4>Bought more?</h4>
        <form class="stack" data-buyform="${h.id}">
          <div class="row">
            <label class="f">Amount<span class="money"><input id="ba-${h.id}" inputmode="decimal" placeholder="${last ? num(last.amount).toFixed(2) : "50.00"}" autocomplete="off"></span></label>
            <label class="f">Price per share<span class="money"><input id="bp-${h.id}" inputmode="decimal" placeholder="${st.price ? st.price.toFixed(2) : "0.00"}" autocomplete="off"></span></label>
            <label class="f">Date<input type="date" id="bd-${h.id}" value="${todayISO()}"></label>
          </div>
          <label class="check"><input type="checkbox" id="bc-${h.id}"${cash > 0 ? " checked" : ""}> Paid from the cash waiting (${gbp(cash)})</label>
          <button class="primary block" type="submit" id="bb-${h.id}">Add buy</button>
        </form>
        <p class="hint">Leave the price blank to use ${st.price ? gbp(st.price) : "the latest price"}.</p>
      </div>

      ${hist.length ? `<div class="sheet-sec"><h4>History</h4><div class="tbl-wrap scroll-y" style="max-height:260px"><table><thead><tr><th>Date</th><th></th><th class="r">Paid</th><th class="r">Price</th><th class="r">Shares</th><th></th></tr></thead><tbody>${hist.map(b => {
        const on = counted.has(b);
        return `<tr class="${on ? "" : "muted"}"><td>${shortDate(b.date)}</td><td>${b.opening ? '<span class="pill b">What you own</span>' : on ? "Buy" : '<span class="pill n" title="Already included in what you own">Included above</span>'}</td><td class="r">${gbp(num(b.amount))}</td><td class="r">${gbp(num(b.price))}</td><td class="r">${fmtShares(sharesIn(b))}</td><td class="r" style="width:34px"><button class="x" data-delbuy="${h.id}|${b.id}" id="db-${b.id}" aria-label="Delete">×</button></td></tr>`;
      }).join("")}</tbody></table></div></div>` : ""}

      <details class="more" data-pot-details="h-${h.id}"${ui.open.has("h-" + h.id) ? " open" : ""}><summary>Name and ticker</summary>
        <div class="row">
          <label class="f">Name<input id="hn-${h.id}" data-hid="${h.id}" data-hf="name" value="${esc(h.name)}" maxlength="50"></label>
          <label class="f">Short name<input id="hs-${h.id}" data-hid="${h.id}" data-hf="short" value="${esc(h.short || "")}" maxlength="20"></label>
          <label class="f">Yahoo ticker<input id="ht-${h.id}" data-hid="${h.id}" data-hf="ticker" value="${esc(h.ticker || "")}" maxlength="20" placeholder="e.g. VUAG.L"></label>
        </div>
        <div style="margin-top:12px"><button type="button" class="small danger" data-delhold="${h.id}" id="dhold-${h.id}">Remove this investment</button></div>
        <p class="hint">Removed one by mistake? Add it again from "Add an investment".</p>
      </details>`);

const te = new TextEncoder(), td = new TextDecoder();

  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(box.iv) }, key, fromB64(box.ct));
  return JSON.parse(td.decode(pt));
}

const personName = id => ((HH.people.find(p => p.id === id) || {}).name) || "Person";

function mergeStates() {

  const out = blankState(); out.merged = true; out.transfers = [];
  const mergedId = (pid, e) => e === "t212" ? e : String(e).startsWith("@") ? String(e).slice(1).replace(":", "") : pid + e;
  out.categories = []; out.pots = []; out.gifts = []; out.months = {};

    const k = keyOf(c.name);

    else cats.get(k).budget = num(cats.get(k).budget) + num(c.budget);

      om.planned += m && m.planned !== undefined && m.planned !== "" && m.planned !== null ? num(m.planned) : num(s.plan.monthly);
      { const keep = state; state = s; om.saved += savedOf(k); state = keep; }
      if (!m) return;
      Object.entries(m.spentFrom || {}).forEach(([e, v]) => { const mid = mergedId(id, e); om.spentFrom[mid] = num(om.spentFrom[mid]) + num(v); });
      om.income.base += num(m.income.base); om.income.op += num(m.income.op); om.income.other += num(m.income.other);
      s.categories.forEach(c => { if (m.spend[c.id] !== undefined) { const nc = cats.get(keyOf(c.name)); om.spend[nc.id] = num(om.spend[nc.id]) + num(m.spend[c.id]); } });
      (m.payments || []).forEach(x => { const c = s.categories.find(c => c.id === x.cat); om.payments = om.payments || []; om.payments.push({ ...x, from: x.from ? mergedId(id, x.from) : "", cat: c ? cats.get(keyOf(c.name)).id : x.cat }); });
    });
    if (ids.some(id => hasSpentTotal(P[id].months[k]))) { const keep = state; om.spentTotal = ids.reduce((t, id) => { state = P[id]; const v = spendOf(k); state = keep; return t + v; }, 0); }

  });

    const who = personName(id);
    P[id].gifts.forEach(g => out.gifts.push({ ...g, id: id + g.id, name: g.name + " (" + who + ")" }));
    P[id].pots.forEach(p => { const cc = {}; Object.entries(p.catCashback || {}).forEach(([cid, r]) => { const c = P[id].categories.find(c => c.id === cid); if (c) cc[cats.get(keyOf(c.name)).id] = r; }); out.pots.push({ ...p, catCashback: cc, id: id + p.id, name: p.name + " · " + (p.joint ? "joint" : who) }); });
    (P[id].transfers || []).forEach(t => out.transfers.push({ ...t, from: mergedId(id, t.from), to: mergedId(id, t.to) }));
  });
  const holds = new Map();
  ids.forEach(id => P[id].sp.holdings.forEach(h => {
    const k = (h.ticker || "").trim().toUpperCase() || (id + ":" + h.id);
    if (!holds.has(k)) { const nh = { ...h, id: "j" + holds.size, buys: [...h.buys] }; holds.set(k, nh); out.sp.holdings.push(nh); }
    else { const nh = holds.get(k); nh.buys = nh.buys.concat(h.buys); if ((h.priceDate || "") > (nh.priceDate || "") && num(h.currentPrice)) { nh.currentPrice = h.currentPrice; nh.priceDate = h.priceDate; } }
  }));

  out.sp.cash.history = [...dates].sort().map(d => ({ date: d, value: ids.reduce((t, id) => t + latestAt(P[id].sp.cash.history, d), 0) }));
  const cashNow = ids.map(id => latestAt(P[id].sp.cash.history, todayISO())), cashTot = cashNow.reduce((a, b) => a + b, 0);
  out.sp.cash.rate = cashTot ? +ids.reduce((t, id, i) => t + cashNow[i] * num(P[id].sp.cash.rate), 0) / cashTot : 0;

/* ---------- live prices ----------
   prices.json is written by a GitHub job that reads Yahoo Finance. GitHub's own timer is unreliable,
   so the app asks for a fresh run (by saving refresh.json) and waits for the new prices. */
let PRICES = null, liveBusy = false;
const liveQuote = h => { const t = (h.ticker || "").trim().toUpperCase(); return t && PRICES && PRICES.quotes ? PRICES.quotes[t] || null : null; };
async function loadPrices() {
  const f = await readFile(SITE_REPO, "prices.json");
  PRICES = f ? JSON.parse(f.text) : { quotes: {} };
  return PRICES;
}
async function addTicker(sym) {
  const f = await readFile(SITE_REPO, "tickers.json");
  const list = f ? JSON.parse(f.text) : [];
  if (list.map(t => t.toUpperCase()).includes(sym.toUpperCase())) return false;
  list.push(sym.toUpperCase());
  await writeFile(SITE_REPO, "tickers.json", JSON.stringify(list, null, 2) + "\n", f && f.sha, "Add " + sym + " to price list");
  return true;
}
async function requestFresh(alreadyAsked) {
  const since = Date.now();
  if (!alreadyAsked) {
    const f = await readFile(SITE_REPO, "refresh.json");
    await writeFile(SITE_REPO, "refresh.json", JSON.stringify({ requested: new Date().toISOString() }) + "\n", f && f.sha, "Refresh prices");
  }
  lsSet("hb-fresh", String(since));
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 6000));
    await loadPrices();
    if (Date.parse(PRICES.updated) > since - 5000) return true;
  }
  return false;
}
function quoteTime(q) { try { const d = new Date(q.time); return d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }

async function liveUpdate(list) {
  list = (list || []).filter(Boolean);
  if (liveBusy || !list.length) return;
  liveBusy = true;
  list.forEach(h => { ui.live[h.id] = { busy: true, msg: "Getting the latest price, about a minute…" }; });
  render();
  try {
    await loadPrices();
    let asked = false;
    for (const h of list) { const t = (h.ticker || "").trim(); if (t && !liveQuote(h)) asked = (await addTicker(t)) || asked; }
    const ok = await requestFresh(asked);
    list.forEach(h => {
      const q = liveQuote(h);
      ui.live[h.id] = !(h.ticker || "").trim() ? { ok: false, msg: "No ticker set (see Name and ticker)." }
        : !q ? { ok: false, msg: "No price found for " + h.ticker + ". Check the ticker." }
        : { ok: ok, msg: (ok ? "Live: " : "Couldn't refresh just now. Last price: ") + gbp(q.price) + " · Yahoo, " + quoteTime(q) };
    });
  } catch (e) {
    list.forEach(h => { ui.live[h.id] = { ok: false, msg: e.code === "token" ? "Access token problem: see Settings." : "Couldn't get prices just now. Try again in a minute." }; });
  }
  liveBusy = false;
  render();
}
// On opening: show the stored prices at once, then ask for fresh ones if they're old (at most every 10 minutes per device)
async function freshOnOpen() {
  try {
    await loadPrices(); render();
    const last = Number(lsGet("hb-fresh") || 0);
    if (priceAge() > 15 * 60e3 && Date.now() - last > 10 * 60e3) {
      const all = [];
      Object.values(P).forEach(st => (st.sp.holdings || []).forEach(h => { if ((h.ticker || "").trim()) all.push(h); }));
      const seen = new Set(); await liveUpdate(all.filter(h => { const t = h.ticker.toUpperCase(); if (seen.has(t)) return false; seen.add(t); return true; }));
    }
  } catch (e) {}
}

  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "lock") { lsSet("hb-pass", null); lsSet("hb-cache", null); location.reload(); }
  if (act === "backup") {
    const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), HH, P }, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "household-budget-backup-" + todayISO() + ".json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  if (act === "check-prices") { try { await loadPrices(); render(); toast("Prices checked"); } catch (err) { toast("Couldn't reach GitHub"); } }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "tokenForm") return;
  e.preventDefault();
  const token = $("#newToken").value.trim(); if (!token) return;
  try {
    await readFile(DATA_REPO, "household.json", token);
    CONFIG = { ...CONFIG, token: await encryptJSON(token, PASS) };
    const cur = await readFile(SITE_REPO, "config.json", token);
    await writeFile(SITE_REPO, "config.json", JSON.stringify(CONFIG, null, 2) + "\n", cur && cur.sha, "Replace access token", token);
    TOKEN = token; tokenProblem = false; render(); toast("Access token replaced");
  } catch (err) { toast(err && err.code === "token" ? "GitHub didn't accept that token" : "Couldn't save the new token. Check its permissions."); }
}, true);


/* ---------- pick up new versions straight away (phones keep old copies otherwise) ---------- */
async function checkForUpdate() {
  try {
    const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/<meta name="build" content="([^"]+)"/);
    const mine = document.querySelector('meta[name="build"]').content;
    if (m && m[1] !== mine && !ui.sheet) location.reload();
  } catch (e) {}
}
checkForUpdate();
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkForUpdate(); if (TOKEN) freshOnOpen(); } });

/* ---------- start ---------- */
(async function boot() {
  renderWho();
  showGate("loading", "Loading…");
  CONFIG = await loadConfig();
  if (!CONFIG) { showGate("setup"); return; }
  const remembered = lsGet("hb-pass");
  if (remembered) {
    try { await unlock(remembered, true); return; }
    catch (e) { lsSet("hb-pass", null); }
  }
  showGate("unlock");
})();
window.addEventListener("hashchange", () => { if (TOKEN) route(); });
})();
</script>
